name: Android build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: cargo test --manifest-path core/Cargo.toml
      - run: bash scripts/build-native.sh
      - run: chmod +x gradlew && ./gradlew --no-daemon lintLiteRelease lintFullRelease assembleLiteRelease assembleFullRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-builds-and-lint
          path: |
            app/build/outputs/apk/*/release/*.apk
            app/build/reports/lint-results-*.html

# CI artefacts are unsigned development outputs. Releases contain locally signed APKs.
