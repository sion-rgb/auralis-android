<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><style>html,body,#player{width:100%;height:100%;margin:0;background:#05090f;color:#e7eff8}#notice{position:absolute;inset:20px;font:16px sans-serif;pointer-events:none}</style></head><body><div id="notice">正在載入 YouTube 官方播放器…</div><div id="player"></div><script>
let player=null,ready=false,lastError=0;const query=new URLSearchParams(location.search);
function auralisSnapshot(){try{const data=ready?player.getVideoData():{};return {ready:ready,state:ready?player.getPlayerState():-1,time:ready?player.getCurrentTime():0,duration:ready?player.getDuration():0,title:data.title||'',videoId:data.video_id||'',error:lastError,muted:ready?player.isMuted():false,volume:ready?player.getVolume():100,rate:ready?player.getPlaybackRate():1}}catch(e){return {ready:false,error:lastError,time:0}}}
function report(){const value=JSON.stringify(auralisSnapshot());if(window.chrome&&window.chrome.webview)window.chrome.webview.postMessage(value);if(window.AuralisBridge)window.AuralisBridge.report(value)}
function auralisControl(command,value){if(!ready)return;switch(command){case'play':player.playVideo();break;case'pause':player.pauseVideo();break;case'toggle':player.getPlayerState()===1?player.pauseVideo():player.playVideo();break;case'seek':player.seekTo(Math.max(0,Number(value)||0),true);break;case'volume':player.setVolume(Math.max(0,Math.min(100,Number(value)||0)));break;case'mute':value?player.mute():player.unMute();break;case'rate':player.setPlaybackRate(Number(value)||1);break;case'repeat':if(value)player.setLoop(true);break;}report()}
function onYouTubeIframeAPIReady(){const vars={autoplay:1,playsinline:1,controls:1,origin:location.origin};if(query.get('list')){vars.listType='playlist';vars.list=query.get('list')}player=new YT.Player('player',{width:'100%',height:'100%',videoId:query.get('v')||undefined,playerVars:vars,events:{onReady:()=>{ready=true;lastError=0;document.getElementById('notice').remove();report()},onStateChange:report,onError:e=>{lastError=Number(e.data);report()},onAutoplayBlocked:report}})}
setInterval(report,500);setTimeout(()=>{if(!ready){lastError=-11;report();document.getElementById('notice').textContent='官方播放器未完成載入；可按原網站重試。'}},20000);const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>{lastError=-10;report()};document.head.appendChild(script);
</script></body></html>
